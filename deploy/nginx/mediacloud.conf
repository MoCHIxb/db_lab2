# MediaCloud Nginx production config template
# Usage:
# 1) Copy to /etc/nginx/sites-available/mediacloud.conf
# 2) Update server_name and SSL cert paths
# 3) Link to sites-enabled and reload nginx

upstream mediacloud_app {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # ACME challenge for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP traffic to HTTPS after cert is configured
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # Replace with your actual cert paths
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # Large file upload support (align with Flask MAX_CONTENT_LENGTH = 2GB)
    client_max_body_size 2048m;

    # Recommended proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts for streaming/download/upload
    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://mediacloud_app;
    }

    access_log /var/log/nginx/mediacloud.access.log;
    error_log /var/log/nginx/mediacloud.error.log warn;
}
